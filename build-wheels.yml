name: Build Wheels

on: [push, workflow_dispatch]  # 推代码或手动触发时运行

jobs:
  build_wheels:
    runs-on: windows-latest  # 使用 GitHub 提供的 Windows 服务器

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5  # 使用 cibuildwheel 官方 Action

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-windows
          path: ./wheelhouse/*.whl
